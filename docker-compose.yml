services:
  db:
    image: postgres:15-alpine
    container_name: budgetwise-db
    environment:
      POSTGRES_DB: budgetwise
      POSTGRES_USER: budgetwise
      POSTGRES_PASSWORD: budgetwise
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budgetwise -d budgetwise"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    container_name: budgetwise-backend
    env_file:
      - backend/.env
    environment:
      DB_URL: jdbc:postgresql://db:5432/budgetwise
      DB_USERNAME: budgetwise
      DB_PASSWORD: budgetwise
      DB_DRIVER: org.postgresql.Driver
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    container_name: budgetwise-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  db-data:
